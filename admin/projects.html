<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <script>try{if(sessionStorage.getItem('admin_tab_ok')!=='1'){window.location.replace('/404.html');}}catch(e){window.location.replace('/404.html');}</script>
  <title>Manage Projects | Portfolio CMS</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%2300f0ff'/><text x='50' y='68' font-size='55' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%23050811'>M</text></svg>">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <!-- Sidebar -->
  <aside class="admin-sidebar" aria-label="Admin Navigation">
    <div class="admin-brand">
      <a href="index.html" class="admin-brand-title">
        <span>&lt;MB <span class="logo-dot"></span>&gt;</span>
        <span class="admin-brand-badge">CMS</span>
      </a>
      <button type="button" class="admin-mobile-toggle" id="admin-sidebar-toggle" aria-label="Toggle Navigation">✕</button>
    </div>

    <nav class="admin-nav" role="navigation">
      <a href="index.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Dashboard</span>
      </a>
      <a href="projects.html" class="admin-nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span>Projects</span>
      </a>
      <a href="skills.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        <span>Skills</span>
      </a>
      <a href="certificates.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
        <span>Certificates</span>
      </a>
      <a href="profile.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile &amp; CV</span>
      </a>
      <a href="messages.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        <span>Messages</span>
      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="../projects.html" class="btn btn-secondary btn-sm" target="_blank" rel="noopener noreferrer" style="justify-content: center; gap: 8px;">
        <span>Public Projects Page ↗</span>
      </a>
      <button type="button" class="btn btn-secondary btn-sm" onclick="adminLogout()" style="justify-content: center; gap: 8px; color: var(--color-danger); border-color: rgba(239,68,68,0.2);">
        <span>Log Out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    
    <!-- Topbar -->
    <header class="admin-topbar">
      <div style="display: flex; align-items: center; gap: var(--space-md);">
        <button type="button" class="admin-mobile-toggle" id="admin-sidebar-toggle-btn" aria-label="Open sidebar">☰</button>
        <h1 class="admin-topbar-title">Projects Manager</h1>
      </div>

      <div class="admin-topbar-actions">
        <button type="button" class="btn-icon theme-toggle" id="admin-theme-toggle" aria-label="Toggle Theme" title="Toggle theme">
          <span class="theme-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>
        </button>
        <span id="admin-user-email" style="font-size: var(--fs-xs); color: var(--text-muted); font-family: var(--font-code);">admin</span>
      </div>
    </header>

    <div class="admin-container">
      
      <!-- Action Toolbar -->
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-md); margin-bottom: var(--space-xl);">
        <div style="display: flex; gap: var(--space-md); flex: 1; max-width: 560px;">
          <input type="text" id="project-search-input" class="admin-input" placeholder="Search projects by title, slug, description...">
          <select id="project-category-filter" class="admin-select" style="max-width: 180px;">
            <option value="all">All Categories</option>
            <option value="fullstack">Full-Stack</option>
            <option value="frontend">Frontend</option>
            <option value="api">API-based</option>
          </select>
        </div>

        <button type="button" class="btn btn-primary" onclick="openCreateProjectModal()">
          <span>+ Add New Project</span>
        </button>
      </div>

      <!-- Projects Table -->
      <div class="admin-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th style="width: 60px;">Order</th>
                <th style="width: 70px;">Media</th>
                <th>Title &amp; Slug</th>
                <th>Category</th>
                <th>Featured</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="projects-table-body">
              <tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: var(--space-xl);">Loading projects...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Project Editor Modal -->
  <div class="admin-modal-backdrop" id="project-editor-modal" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
    <div class="admin-modal-card">
      <div class="admin-modal-header">
        <h2 class="admin-card-title" id="project-modal-title">Project Editor</h2>
        <button type="button" class="admin-modal-close" onclick="closeAdminModal('project-editor-modal')" aria-label="Close modal">✕</button>
      </div>

      <form id="project-form">
        <input type="hidden" id="project-id-field">

        <!-- Top Details -->
        <div class="form-row">
          <div class="admin-form-group">
            <label for="proj-title" class="admin-label">Project Title *</label>
            <input type="text" id="proj-title" class="admin-input" required placeholder="e.g. EduManager">
          </div>
          <div class="admin-form-group">
            <label for="proj-slug" class="admin-label">Slug (Identifier) *</label>
            <input type="text" id="proj-slug" class="admin-input" required placeholder="edumanager">
          </div>
        </div>

        <div class="form-row">
          <div class="admin-form-group">
            <label for="proj-category" class="admin-label">Category *</label>
            <select id="proj-category" class="admin-select" required>
              <option value="fullstack">Full-Stack / Backend</option>
              <option value="frontend">Frontend / UI</option>
              <option value="api">API-based</option>
            </select>
          </div>
          <div class="admin-form-group">
            <label for="proj-status" class="admin-label">Status *</label>
            <select id="proj-status" class="admin-select" required>
              <option value="published">Published</option>
              <option value="draft">Draft (Hidden from public)</option>
            </select>
          </div>
        </div>

        <div class="admin-form-group" style="flex-direction: row; align-items: center; gap: 8px;">
          <input type="checkbox" id="proj-featured" style="width: 18px; height: 18px; accent-color: var(--accent);">
          <label for="proj-featured" class="admin-label" style="margin: 0; cursor: pointer;">Feature on Homepage Showcase</label>
        </div>

        <!-- Links -->
        <div class="form-row">
          <div class="admin-form-group">
            <label for="proj-live-url" class="admin-label">Live Demo URL</label>
            <input type="url" id="proj-live-url" class="admin-input" placeholder="https://demo.example.com">
          </div>
          <div class="admin-form-group">
            <label for="proj-github-url" class="admin-label">GitHub Repository URL</label>
            <input type="url" id="proj-github-url" class="admin-input" placeholder="https://github.com/MarwanBouhamid07/repo">
          </div>
        </div>

        <!-- Image Upload Zone -->
        <div class="admin-form-group">
          <label class="admin-label">Project Cover Media (Auto-compressed to WebP, Max 1600px, 2MB)</label>
          <div class="upload-zone" id="project-upload-zone">
            <input type="file" id="project-file-input" accept="image/jpeg,image/png,image/webp,image/svg+xml" style="display: none;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto var(--space-sm); color: var(--accent);"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <p style="font-size: var(--fs-sm); color: var(--text-primary); font-weight: 600;">Click or drag and drop image here</p>
            <p style="font-size: var(--fs-xs); color: var(--text-muted); margin-top: 4px;">Supports PNG, JPG, WebP, SVG (Max 2MB)</p>
            <img id="image-preview" src="" alt="Preview" class="upload-preview" style="display: none; margin: var(--space-md) auto 0;">
          </div>
        </div>

        <!-- Multilingual Content Tabs -->
        <div style="margin-top: var(--space-xl); border-top: 1px solid var(--border-color); padding-top: var(--space-lg);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-sm);">
            <label class="admin-label">Localized Descriptions &amp; Overviews</label>
            <div class="lang-tabs" style="margin-bottom: 0;">
              <button type="button" class="lang-tab-btn active" data-lang="en">English (EN)</button>
              <button type="button" class="lang-tab-btn" data-lang="fr">Français (FR)</button>
              <button type="button" class="lang-tab-btn" data-lang="ar">العربية (AR)</button>
            </div>
          </div>

          <!-- EN Pane -->
          <div class="lang-tab-pane active" data-lang="en">
            <div class="admin-form-group">
              <label for="proj-cat-label-en" class="admin-label">Category Badge (EN)</label>
              <input type="text" id="proj-cat-label-en" class="admin-input" placeholder="e.g. Full-Stack / Backend">
            </div>
            <div class="admin-form-group">
              <label for="proj-desc-en" class="admin-label">Short Description (EN) *</label>
              <textarea id="proj-desc-en" class="admin-textarea" required placeholder="Brief project summary shown on cards..."></textarea>
            </div>
            <div class="admin-form-group">
              <label for="proj-overview-en" class="admin-label">Detailed Overview (EN)</label>
              <textarea id="proj-overview-en" class="admin-textarea" style="min-height: 120px;" placeholder="Full project architecture, technologies, and features for modal..."></textarea>
            </div>
          </div>

          <!-- FR Pane -->
          <div class="lang-tab-pane" data-lang="fr">
            <div class="admin-form-group">
              <label for="proj-cat-label-fr" class="admin-label">Badge de Catégorie (FR)</label>
              <input type="text" id="proj-cat-label-fr" class="admin-input" placeholder="ex. Full-Stack / Backend">
            </div>
            <div class="admin-form-group">
              <label for="proj-desc-fr" class="admin-label">Description Courte (FR)</label>
              <textarea id="proj-desc-fr" class="admin-textarea" placeholder="Résumé du projet affiché sur la carte..."></textarea>
            </div>
            <div class="admin-form-group">
              <label for="proj-overview-fr" class="admin-label">Présentation Détaillée (FR)</label>
              <textarea id="proj-overview-fr" class="admin-textarea" style="min-height: 120px;" placeholder="Présentation approfondie pour la modale..."></textarea>
            </div>
          </div>

          <!-- AR Pane -->
          <div class="lang-tab-pane" data-lang="ar" dir="rtl">
            <div class="admin-form-group">
              <label for="proj-cat-label-ar" class="admin-label">شارة التصنيف (العربية)</label>
              <input type="text" id="proj-cat-label-ar" class="admin-input" placeholder="مثال: شامل / خلفي (Full-Stack)">
            </div>
            <div class="admin-form-group">
              <label for="proj-desc-ar" class="admin-label">الوصف الموجز (العربية)</label>
              <textarea id="proj-desc-ar" class="admin-textarea" placeholder="ملخص سريع يظهر في بطاقة المشروع..."></textarea>
            </div>
            <div class="admin-form-group">
              <label for="proj-overview-ar" class="admin-label">نظرة عامة مفصلة (العربية)</label>
              <textarea id="proj-overview-ar" class="admin-textarea" style="min-height: 120px;" placeholder="شرح تفصيلي للمشروع يظهر في النافذة المنبثقة..."></textarea>
            </div>
          </div>
        </div>

        <!-- Form Actions -->
        <div style="display: flex; gap: var(--space-md); justify-content: flex-end; margin-top: var(--space-xl); border-top: 1px solid var(--border-color); padding-top: var(--space-lg);">
          <button type="button" class="btn btn-secondary" onclick="closeAdminModal('project-editor-modal')">Cancel</button>
          <button type="submit" id="save-project-btn" class="btn btn-primary">
            <span>Save Project</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Pinned Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="admin-common.js"></script>
  <script src="admin-projects.js"></script>

</body>
</html>
