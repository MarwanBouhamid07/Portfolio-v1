<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <script>try{if(sessionStorage.getItem('admin_tab_ok')!=='1'){window.location.replace('/404.html');}}catch(e){window.location.replace('/404.html');}</script>
  <title>Manage Skills | Portfolio CMS</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%2300f0ff'/><text x='50' y='68' font-size='55' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%23050811'>M</text></svg>">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <!-- Sidebar -->
  <aside class="admin-sidebar" aria-label="Admin Navigation">
    <div class="admin-brand">
      <a href="index.html" class="admin-brand-title">
        <span>&lt;MB <span class="logo-dot"></span>&gt;</span>
        <span class="admin-brand-badge">CMS</span>
      </a>
      <button type="button" class="admin-mobile-toggle" id="admin-sidebar-toggle" aria-label="Toggle Navigation">✕</button>
    </div>

    <nav class="admin-nav" role="navigation">
      <a href="index.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Dashboard</span>
      </a>
      <a href="projects.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span>Projects</span>
      </a>
      <a href="skills.html" class="admin-nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        <span>Skills</span>
      </a>
      <a href="certificates.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
        <span>Certificates</span>
      </a>
      <a href="profile.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile &amp; CV</span>
      </a>
      <a href="messages.html" class="admin-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        <span>Messages</span>
      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="../about.html#skills-heading" class="btn btn-secondary btn-sm" target="_blank" rel="noopener noreferrer" style="justify-content: center; gap: 8px;">
        <span>Public Skills View ↗</span>
      </a>
      <button type="button" class="btn btn-secondary btn-sm" onclick="adminLogout()" style="justify-content: center; gap: 8px; color: var(--color-danger); border-color: rgba(239,68,68,0.2);">
        <span>Log Out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    
    <!-- Topbar -->
    <header class="admin-topbar">
      <div style="display: flex; align-items: center; gap: var(--space-md);">
        <button type="button" class="admin-mobile-toggle" id="admin-sidebar-toggle-btn" aria-label="Open sidebar">☰</button>
        <h1 class="admin-topbar-title">Skills &amp; Technology Stack</h1>
      </div>

      <div class="admin-topbar-actions">
        <button type="button" class="btn-icon theme-toggle" id="admin-theme-toggle" aria-label="Toggle Theme">
          <span class="theme-icon"></span>
        </button>
        <span id="admin-user-email" style="font-size: var(--fs-xs); color: var(--text-muted); font-family: var(--font-code);">admin</span>
      </div>
    </header>

    <div class="admin-container">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-xl);">
        <div>
          <p style="color: var(--text-muted); font-size: var(--fs-sm);">
            Manage skills grouped by category. Strict rule: NO percentage bars.
          </p>
        </div>
        <button type="button" class="btn btn-primary" onclick="openCreateSkillModal('backend')">
          <span>+ Add Skill</span>
        </button>
      </div>

      <!-- Skills Groups Container -->
      <div id="skills-groups-container">
        <div class="admin-card" style="text-align: center; color: var(--text-muted); padding: var(--space-xl);">Loading skills...</div>
      </div>

    </div>
  </main>

  <!-- Skill Editor Modal -->
  <div class="admin-modal-backdrop" id="skill-editor-modal" role="dialog" aria-modal="true" aria-labelledby="skill-modal-title">
    <div class="admin-modal-card" style="max-width: 520px;">
      <div class="admin-modal-header">
        <h2 class="admin-card-title" id="skill-modal-title">Skill Editor</h2>
        <button type="button" class="admin-modal-close" onclick="closeAdminModal('skill-editor-modal')" aria-label="Close modal">✕</button>
      </div>

      <form id="skill-form">
        <input type="hidden" id="skill-id-field">

        <div class="admin-form-group">
          <label for="skill-name" class="admin-label">Skill Name *</label>
          <input type="text" id="skill-name" class="admin-input" required placeholder="e.g. Laravel, React, Docker">
        </div>

        <div class="admin-form-group">
          <label for="skill-category" class="admin-label">Category *</label>
          <select id="skill-category" class="admin-select" required>
            <option value="backend">Backend (Server &amp; Database)</option>
            <option value="frontend">Frontend (UI &amp; Interaction)</option>
            <option value="tools">Tools &amp; Workflow (Version &amp; Design)</option>
            <option value="basic">Basic Level (Foundational)</option>
          </select>
        </div>

        <div class="admin-form-group">
          <label for="skill-level-label" class="admin-label">Level Label (Optional, e.g. "Basic Level", "Server &amp; Database")</label>
          <input type="text" id="skill-level-label" class="admin-input" placeholder="e.g. Server & Database">
        </div>

        <div style="display: flex; gap: var(--space-xl); margin: var(--space-lg) 0;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="skill-marquee" style="width: 18px; height: 18px; accent-color: var(--accent);">
            <label for="skill-marquee" class="admin-label" style="margin: 0; cursor: pointer;">Show in Infinite Marquee</label>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="skill-visible" style="width: 18px; height: 18px; accent-color: var(--accent);">
            <label for="skill-visible" class="admin-label" style="margin: 0; cursor: pointer;">Visible on Public Site</label>
          </div>
        </div>

        <div style="display: flex; gap: var(--space-md); justify-content: flex-end; margin-top: var(--space-xl); border-top: 1px solid var(--border-color); padding-top: var(--space-lg);">
          <button type="button" class="btn btn-secondary" onclick="closeAdminModal('skill-editor-modal')">Cancel</button>
          <button type="submit" id="save-skill-btn" class="btn btn-primary">
            <span>Save Skill</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Pinned Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="admin-common.js"></script>
  <script src="admin-skills.js"></script>

</body>
</html>
